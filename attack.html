<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ball Hunt</title>
<link rel="stylesheet" href="attack.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="box score"><small>SCORE</small><b id="sYou">0</b></div>
    <div class="box timer"><small>TIME</small><b id="time">60</b><small id="themeName"></small><i id="bar"></i></div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>Ball Hunt</h1>
      <p id="msg"></p>
      <button id="startBtn">Start Game</button>
    </div>
  </main>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="score.js"></script>
<script src="attack-sound.js"></script>
<script src="attack.js"></script>
</body>
</html>
