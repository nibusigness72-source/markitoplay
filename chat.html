<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>

  <!-- VIEW 0: Chat Lock (Username + Password) -->
  <div class="lock" id="lockView" style="display:none">
    <div class="lock-head">
      <div class="lock-logo">🛡️</div>
      <div><h1>MARKITO</h1><p>Secure • Ephemeral • Private</p></div>
      <div class="pp">🔒 Your Privacy<br>Our Priority</div>
    </div>
    <div class="lock-card">
      <div id="lkWho" style="display:none"></div>
      <div id="nameBlock">
        <h3>👤 Username</h3>
        <input type="text" id="lkName" maxlength="16" placeholder="Username (a-z, 0-9, _)" autocomplete="off" autocapitalize="none">
        <div class="bad" id="nameErr"></div>
        <h4 class="sug-t">💡 Suggested Usernames</h4>
        <div id="sugList"></div>
      </div>
      <h3 id="pwLabel" style="margin-top:16px">🔒 Password</h3>
      <div class="pw-row">
        <input type="password" id="lkPass" maxlength="38" placeholder="Enter password" autocomplete="off">
        <button type="button" id="lkEye">👁</button>
      </div>
      <div class="pw-meta"><span class="cnt" id="pwCount">0/38</span> Password must be exactly 38 characters <button type="button" id="lkGen">🎲 Banao</button></div>
      <p class="hint" id="lkMsg"></p>
      <button class="lk-btn" id="lkGo">Continue</button>
      <div class="forgot" id="forgotBox" style="display:none">
        <div><b>Forgot Password</b>Click to reset your password if you ever forget it.</div>
        <button type="button" id="lkReset">Reset Now ›</button>
      </div>
    </div>
  </div>

  <!-- VIEW 1: Search -->
  <div class="app" id="searchView">
    <header class="header">
      <a href="settings.html" class="back-btn">←</a>
      <h1>Chat</h1>
      <button class="bell" id="bellBtn">🔔</button>
    </header>

    <form class="search-box" id="searchForm">
      <input type="text" id="uidInput" maxlength="16" placeholder="Player ID ya Username likho" autocomplete="off">
      <button type="submit">🔍</button>
    </form>
    <p class="hint" id="searchMsg"></p>

    <div id="resultBox"></div>

    <h2 class="sub-title" id="recentTitle" style="display:none">Chats</h2>
    <div id="recentBox"></div>
  </div>

  <!-- VIEW 2: Chat window -->
  <div class="chat-view" id="chatView" style="display:none">
    <header class="chat-head">
      <button class="back-btn" id="chatBack">←</button>
      <div class="avatar" id="peerAvatar">🧑</div>
      <div class="peer-info">
        <div class="name-row">
          <span class="peer-name" id="peerName">Player</span>
          <button class="nick-btn" id="nickBtn" title="Naam badlo">✏️</button>
        </div>
        <span class="peer-id" id="peerId"></span>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="emoji-panel" id="emojiPanel" style="display:none"></div>

    <div class="edit-bar" id="editBar" style="display:none">
      <span>✏️ Message edit ho raha hai</span>
      <button id="editCancel">✖</button>
    </div>

    <div class="input-bar">
      <button class="icon-btn" id="emojiBtn">😊</button>
      <div class="input-wrap">
        <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
        <span class="counter" id="counter">0/50</span>
      </div>
      <label class="icon-btn cam" for="photoPick">📷</label>
      <input type="file" id="photoPick" accept="image/*" hidden>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Photo full screen -->
  <div class="viewer" id="viewer" style="display:none">
    <div class="viewer-top">
      <button id="viewerClose">✕</button>
      <span id="viewerTimer"></span>
    </div>
    <img id="viewerImg" draggable="false" alt="">
  </div>

  <!-- Message menu -->
  <div class="sheet-bg" id="sheetBg" style="display:none"><div class="sheet" id="sheet"></div></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
