<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Game - PLAY&amp;WIN</title>
  <link rel="stylesheet" href="snake-game.css">
</head>
<body>
  <!-- Poora game #wrap ke andar hai. Phone seedha ho to ye apne aap 90 degree ghoom kar lamba ho jata hai -->
  <div id="wrap">
  <canvas id="game"></canvas>

  <a href="play.html" class="back">←</a>

  <div class="hud">
    <div class="pill big">⭐ <b id="score">0</b></div>
    <div class="pill">⏱ <b id="time">5:00</b></div>
    <div class="pill">🪙 <b id="coins">0</b></div>
  </div>

  <div class="fx" id="fx"></div>
  <div class="banner" id="banner"></div>

  <div class="wait" id="wait">
    <div class="wmsg" id="wmsg"></div>
    <div class="wnum" id="wnum"></div>
  </div>

  <div class="gad">
    <button id="g0">🧲<i id="c0">0</i></button>
    <button id="g1">🔍<i id="c1">0</i></button>
    <button id="g2">⚡<i id="c2">0</i></button>
  </div>

  
  <div class="hint" id="hint">Ungli se ghumao • doosri ungli ya ⏫ dabao = speed</div>

  <div class="overlay" id="overlay">
    <div class="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="gold-btn" id="againBtn">Play Again</button>
      <a href="play.html" class="back-link">Wapas jao</a>
    </div>
  </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="score.js"></script>
  <script src="snake-sound.js"></script>
  <script src="snake-game.js"></script>
</body>
</html>
